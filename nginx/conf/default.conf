server {
    listen 80;
    server_name localhost;

    # ------------------------------------------------------------------
    # HARDENING PERIMETRAL (Seguridad OWASP)
    # ------------------------------------------------------------------
    # Desactiva la firma de versión de Nginx en las respuestas HTTP
    server_tokens off;

    # Protección contra Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Protección contra MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Activación del filtro XSS en navegadores compatibles
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------------------------------
    # PROXY INVERSO (Reenvío al contenedor apache-backend)
    # ------------------------------------------------------------------
    location / {
        # Redirige el tráfico al nombre de servicio definido en docker-compose
        proxy_pass http://apache-backend:80;

        # Cabeceras de trazabilidad e IP real (Cumplimiento RGPD)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera estándar para el backend
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}